server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward /api requests to the backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA catch-all
    location / {
        try_files $uri $uri/ /index.html;
    }
}
